[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-observer-agent"
version = "0.1.0"
description = "Low-latency temporal VLM monitor for Flow Conductor"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
robot-agent = "robot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_agent = ["prompts/*.txt"]
