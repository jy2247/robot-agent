[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-observer-agent"
version = "0.1.0"
description = "Temporal VLM critic scaffold for Flow Conductor and VLA execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robot-agent = "robot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_agent = ["prompts/*.txt"]
